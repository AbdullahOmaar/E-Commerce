name: Modern storefront quality
on:
  pull_request:
    branches: [master]
  push:
    branches: ['enterprise-upgrade/**']
permissions:
  contents: read
concurrency:
  group: modern-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modern-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/storefront/.nvmrc
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build:production
